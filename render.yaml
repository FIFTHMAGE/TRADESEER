services:
  - type: web
    name: tradeseer-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    # Environment variables for the bot
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: PORT
        value: "5000" 