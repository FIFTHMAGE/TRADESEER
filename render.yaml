services:
  - type: web
    name: tradeseer-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python webhook_bot.py
    plan: free
    # Force Render to use webhook version
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false 